<!--
  basic console — sign-in code.

  Paste into Supabase → Authentication → Emails (Email Templates):
    · "Magic Link"      — what an existing administrator receives
    · "Confirm signup"  — what an invited address that has never signed in
                          receives instead, when it asks for a code

  Subject for both:  Your basic console code

  {{ .Token }} is the code the sign-in form asks for. There is deliberately no
  link: a link can be opened in the wrong browser, or used up by a mail scanner
  before anyone clicks it; a code is only ever used where it is typed.

  Inline styles only — mail clients drop <style> blocks and ignore classes.
-->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #2f3044; max-width: 420px; margin: 0 auto; padding: 32px 24px;">
  <p style="margin: 0 0 24px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #c9603f;">basic console</p>

  <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.5;">Your sign-in code:</p>

  <p style="margin: 0 0 24px; padding: 18px 0; border-radius: 16px; background: #f7efe6; text-align: center; font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 34px; font-weight: 700; letter-spacing: 0.3em; color: #2f3044;">{{ .Token }}</p>

  <p style="margin: 0 0 8px; font-size: 14px; line-height: 1.5; color: #6b6d82;">Type it into the sign-in page. It works once, for an hour, and asking for a new code replaces it.</p>

  <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #6b6d82;">Did not ask for it? Ignore this email — nobody can sign in without the code.</p>
</div>
